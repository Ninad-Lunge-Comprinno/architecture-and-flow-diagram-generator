name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies and package
        run: |
          python -m pip install -U pip
          # Reproducible, hash-verified dependency closure.
          pip install --require-hashes -r requirements.lock
          # Install the package itself without re-resolving deps.
          pip install -e . --no-deps

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the CLI entry point
        run: |
          arch-diagram --input outputs/acme-orders/acme-orders.spec.yaml \
            --output /tmp/ci-smoke.drawio.xml
          test -s /tmp/ci-smoke.drawio.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
