provider: aws
metadata:
  client_name: "docustack.ai"
  project: "docustack.ai"
  version: "1.0"
  date: "2026-10-06"
  creator: "To be filled"
  reviewer: "To be filled"

pages:
  - name: "Architecture Diagram"
    type: architecture

    global:
      - { id: r53, service: route_53, label: "Route 53" }
      - { id: s3,  service: s3,       label: "S3" }

    edge:
      - { id: users, service: users,                      label: "Users" }
      - { id: waf,   service: waf,                         label: "WAF" }
      - { id: alb,   service: application_load_balancer,   label: "ALB (External)" }
      - { id: igw,   service: internet_gateway,            label: "IGW" }

    region:
      label: "ap-south-1 (Mumbai)"
      services:
        - { id: apigw,      service: api_gateway,              label: "API Gateway" }
        - { id: lambda,     service: lambda,                   label: "Lambda" }
        - { id: bedrock,    service: bedrock,                  label: "Bedrock (Anthropic)" }
        - { id: transcribe, service: transcribe,               label: "Transcribe" }
        - { id: ecr,        service: ecr,                      label: "ECR" }
        - { id: msk,        service: managed_streaming_for_kafka, label: "MSK (Kafka)" }

      vpc:
        label: "docustack Prod VPC"
        azs:
          - id: az1
            label: "Availability Zone 1"
            public_subnet:
              id: pub1
              label: "public-subnet-1"
              resources:
                - { id: nat1, service: nat_gateway, label: "NAT Gateway" }
            app_subnet:
              id: app1
              label: "app-subnet-1"
              resources: []
            db_subnet:
              id: data1
              label: "db-subnet-1"
              resources:
                - { id: rds1,   service: rds,        label: "RDS PostgreSQL (Primary)" }
                - { id: docdb1, service: documentdb, label: "DocumentDB" }

          - id: az2
            label: "Availability Zone 2"
            public_subnet:
              id: pub2
              label: "public-subnet-2"
              resources: []
            app_subnet:
              id: app2
              label: "app-subnet-2"
              resources: []
            db_subnet:
              id: data2
              label: "db-subnet-2"
              resources:
                - { id: rds2,   service: rds,        label: "RDS PostgreSQL (Standby)" }
                - { id: docdb2, service: documentdb, label: "DocumentDB (Replica)" }

          - id: az3
            label: "Availability Zone 3"
            public_subnet:
              id: pub3
              label: "public-subnet-3"
              resources: []
            app_subnet:
              id: app3
              label: "app-subnet-3"
              resources: []
            db_subnet:
              id: data3
              label: "db-subnet-3"
              resources:
                - { id: rds3, service: rds, label: "RDS PostgreSQL (Standby)" }

        compute_groups:
          - { id: eks, kind: eks_cluster, node_service: fargate, label: "EKS Cluster (Fargate)" }
          - { id: ecs, kind: ecs_cluster, node_service: fargate, label: "ECS Cluster (Fargate)" }
          - { id: asg, kind: asg,         node_service: ec2,     label: "EC2 Auto Scaling Group" }

    edges:
      # Public ingress path (web traffic → ALB → clusters)
      - { source: users, target: waf,  label: "HTTPS" }
      - { source: waf,   target: igw }
      - { source: igw,   target: alb }
      - { source: alb,   target: eks,  label: "route" }

      # Serverless API path — fed from DNS ingress (Route 53 → API Gateway).
      # Route 53 sits in the global row directly above the region services, so
      # this entry edge stays short and clear of the ALB/IGW gutter.
      - { source: r53,    target: apigw, label: "api" }
      - { source: apigw,  target: lambda, label: "invoke" }
      - { source: lambda, target: bedrock, label: "OCR / NER" }
      - { source: bedrock, target: transcribe, label: "transcription" }
      - { source: bedrock, target: s3, label: "documents", dashed: true }

      # Cluster to data stores
      # Note: MSK is shown as a region service (it is part of the stack), but
      # the EKS → MSK event-streaming edge is drawn only on the Request Flow
      # page to keep the architecture region-service row free of a long
      # cross-row connector.
      - { source: eks, target: rds1,   label: "SQL" }
      - { source: eks, target: docdb1, label: "NoSQL" }

      # EC2 ASG to RDS
      - { source: asg, target: rds1, label: "SQL" }

      # Deployment
      - { source: ecr, target: eks, label: "deploy", dashed: true }
      - { source: ecr, target: ecs, label: "deploy", dashed: true }

  - name: "Request Flow"
    type: flow
    nodes:
      - { id: user,       service: users,                     label: "User", scope: external }
      - { id: r53,        service: route_53,                  label: "Route 53" }
      - { id: waf,        service: waf,                        label: "WAF" }
      - { id: apigw,      service: api_gateway,                label: "API Gateway" }
      - { id: lambda,     service: lambda,                     label: "Lambda" }
      - { id: alb,        service: application_load_balancer,  label: "ALB" }
      - { id: eks,        service: eks,                        label: "EKS Fargate", scope: vpc }
      - { id: s3,         service: s3,                         label: "S3" }
      - { id: bedrock,    service: bedrock,                    label: "Bedrock (Anthropic)" }
      - { id: transcribe, service: transcribe,                 label: "Transcribe" }
      - { id: rds,        service: rds,                        label: "RDS PostgreSQL", scope: vpc }
      - { id: docdb,      service: documentdb,                 label: "DocumentDB", scope: vpc }
      - { id: msk,        service: managed_streaming_for_kafka, label: "MSK (Kafka)" }
    edges:
      - { source: user,   target: r53,    label: "request" }
      - { source: r53,    target: waf,     label: "resolve" }
      - { source: waf,    target: apigw,   label: "api call" }
      - { source: apigw,  target: lambda,  label: "invoke" }
      - { source: lambda, target: s3,      label: "store doc" }
      - { source: lambda, target: bedrock, label: "OCR / NER" }
      - { source: bedrock, target: transcribe, label: "audio transcription" }
      - { source: waf,    target: alb,     label: "web traffic" }
      - { source: alb,    target: eks,     label: "route" }
      - { source: eks,    target: msk,     label: "publish events" }
      - { source: eks,    target: rds,     label: "SQL" }
      - { source: eks,    target: docdb,   label: "NoSQL" }
    groups:
      - id: docu_vpc
        kind: vpc
        label: "docustack Prod VPC"
        members: [eks, rds, docdb]
