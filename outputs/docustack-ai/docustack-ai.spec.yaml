provider: aws
metadata:
  client_name: "docustack.ai"
  project: "Docustack AI"
  version: "1.0"
  date: "2026-10-07"
  creator: "Sanvee Karandikar"
  reviewer: "Saqib Mehraj"

pages:
  - name: "Architecture Diagram"
    type: architecture
    edge:
      - { id: users, service: users, label: "Users" }
      - { id: waf, service: waf, label: "AWS WAF" }
      - { id: alb, service: application_load_balancer, label: "ALB" }
      - { id: igw, service: internet_gateway, label: "Internet Gateway" }
    region:
      label: "ap-south-1 (Mumbai)"
      services:
        - { id: route53, service: route_53, label: "Route 53" }
        - { id: apigw, service: api_gateway, label: "API Gateway" }
        - { id: lambda, service: lambda, label: "Lambda" }
        - { id: bedrock, service: bedrock, label: "Bedrock (Anthropic)" }
        - { id: transcribe, service: transcribe, label: "Transcribe" }
        - { id: s3, service: s3, label: "S3 (Documents)" }
        - { id: kafka, service: managed_streaming_for_kafka, label: "Amazon MSK (Kafka)" }
        - { id: ecr, service: ecr, label: "ECR" }
        - { id: docdb, service: documentdb, label: "DocumentDB" }
      vpc:
        label: "Docustack VPC"
        azs:
          - id: az1
            label: "Availability Zone 1"
            public_subnet:
              id: pub1
              label: "public-subnet-1"
              resources:
                - { id: nat1, service: nat_gateway, label: "NAT Gateway" }
            app_subnet:
              id: app1
              label: "app-subnet-1"
              resources: []
            db_subnet:
              id: data1
              label: "db-subnet-1"
              resources:
                - { id: rds1, service: rds, label: "RDS PostgreSQL" }
          - id: az2
            label: "Availability Zone 2"
            public_subnet:
              id: pub2
              label: "public-subnet-2"
              resources: []
            app_subnet:
              id: app2
              label: "app-subnet-2"
              resources: []
            db_subnet:
              id: data2
              label: "db-subnet-2"
              resources:
                - { id: rds2, service: rds, label: "RDS PostgreSQL" }
          - id: az3
            label: "Availability Zone 3"
            public_subnet:
              id: pub3
              label: "public-subnet-3"
              resources: []
            app_subnet:
              id: app3
              label: "app-subnet-3"
              resources: []
            db_subnet:
              id: data3
              label: "db-subnet-3"
              resources:
                - { id: rds3, service: rds, label: "RDS PostgreSQL" }
        compute_groups:
          - { id: asg, kind: asg, node_service: ec2, label: "Auto Scaling Group (EC2)" }
          - { id: eks, kind: eks_cluster, node_service: fargate, label: "EKS Cluster (Fargate)" }
          - { id: ecs, kind: ecs_cluster, node_service: fargate, label: "ECS Cluster (Fargate)" }
    edges:
      - { source: users, target: waf, label: "HTTPS" }
      - { source: route53, target: waf, label: "DNS" }
      - { source: waf, target: igw, label: "filtered" }
      - { source: igw, target: alb }
      - { source: alb, target: eks, label: "route" }
      - { source: alb, target: ecs, label: "route" }
      - { source: alb, target: asg, label: "route" }
      - { source: apigw, target: lambda, label: "invoke" }
      - { source: lambda, target: bedrock, label: "OCR + NER" }
      - { source: lambda, target: s3, label: "store docs" }
      - { source: bedrock, target: transcribe, label: "audio" }
      - { source: eks, target: rds1, label: "queries" }
      - { source: eks, target: docdb, label: "documents" }
      - { source: ecs, target: rds1, label: "queries" }
      - { source: asg, target: rds1, label: "queries" }
      - { source: eks, target: kafka, label: "events" }
      - { source: ecs, target: kafka, label: "events" }
      - { source: ecr, target: eks, label: "image pull", dashed: true }
      - { source: ecr, target: ecs, label: "image pull", dashed: true }

  - name: "Document Processing Flow"
    type: flow
    nodes:
      - { id: user, service: users, label: "User uploads document", scope: external }
      - { id: apigw, service: api_gateway, label: "API Gateway" }
      - { id: lambda, service: lambda, label: "Ingestion Lambda" }
      - { id: s3, service: s3, label: "S3 (raw documents)" }
      - { id: bedrock, service: bedrock, label: "Bedrock OCR + NER" }
      - { id: transcribe, service: transcribe, label: "Transcribe (audio)" }
      - { id: decision, service: bedrock, label: "Decision Engine (Bedrock)" }
      - { id: rds, service: rds, label: "RDS PostgreSQL" }
      - { id: docdb, service: documentdb, label: "DocumentDB" }
      - { id: kafka, service: managed_streaming_for_kafka, label: "MSK (events)" }
    edges:
      - { source: user, target: apigw, label: "upload" }
      - { source: apigw, target: lambda, label: "invoke" }
      - { source: lambda, target: s3, label: "store" }
      - { source: s3, target: bedrock, label: "document" }
      - { source: s3, target: transcribe, label: "audio" }
      - { source: bedrock, target: decision, label: "entities" }
      - { source: transcribe, target: decision, label: "transcript" }
      - { source: decision, target: rds, label: "structured data" }
      - { source: decision, target: docdb, label: "extracted docs" }
      - { source: decision, target: kafka, label: "events" }
