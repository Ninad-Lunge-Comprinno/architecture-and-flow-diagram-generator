provider: aws

metadata:
  project: "Dual-VPC Mirror Pair via Transit Gateway"
  version: "1.0"
  date: "2026-10-05"
  creator: "Kiro"
  reviewer: "Cloud Team"

pages:

  - name: "Architecture Diagram"
    type: architecture

    global:
      - { id: r53, service: route_53,                       label: "Route 53" }
      - { id: cf,  service: cloudfront,                     label: "CloudFront" }
      - { id: s3,  service: s3,                             label: "S3" }
      - { id: iam, service: identity_and_access_management, label: "IAM" }

    edge:
      - { id: users, service: user, label: "Users" }
      - { id: waf-a, service: waf, label: "AWS WAF A", vpc: vpc-a }
      - { id: alb-a, service: application_load_balancer, label: "ALB A", vpc: vpc-a }
      - { id: igw-a, service: internet_gateway, label: "Internet Gateway A", vpc: vpc-a }
      - { id: waf-b, service: waf, label: "AWS WAF B", vpc: vpc-b }
      - { id: alb-b, service: application_load_balancer, label: "ALB B", vpc: vpc-b }
      - { id: igw-b, service: internet_gateway, label: "Internet Gateway B", vpc: vpc-b }
      - { id: waf-c, service: waf, label: "AWS WAF C", vpc: vpc-c }
      - { id: alb-c, service: application_load_balancer, label: "ALB C", vpc: vpc-c }
      - { id: igw-c, service: internet_gateway, label: "Internet Gateway C", vpc: vpc-c }

    region:
      label: "us-east-1"

      services:
        - { id: kms,     service: key_management_service, label: "KMS" }
        - { id: secrets, service: secrets_manager,        label: "Secrets Manager" }
        - { id: cw,      service: cloudwatch_2,           label: "CloudWatch" }
        - { id: ct,      service: cloudtrail,             label: "CloudTrail" }
        - { id: gd,      service: guardduty,              label: "GuardDuty" }
        - { id: ecr,     service: ecr,                    label: "Amazon ECR" }

      transit_gateway:
        id: tgw
        label: "Transit Gateway"

      vpcs:

        - id: vpc-a
          label: "VPC-A (10.0.0.0/16)"

          azs:

            - id: a-az1
              label: "VPC-A Availability Zone 1"

              public_subnet:
                id: a-pub1
                label: "VPC-A Public Subnet 1"
                resources:
                  - { id: nat-a1,     service: nat_gateway, label: "NAT Gateway A" }
                  - { id: bastion-a1, service: ec2,         label: "Bastion Host A" }

              app_subnet:
                id: a-app1
                label: "VPC-A Private App Subnet 1"
                resources: []

              db_subnet:
                id: a-db1
                label: "VPC-A Private DB Subnet 1"
                resources:
                  - { id: valkey-a1, service: elasticache, label: "Valkey / Redis A1" }
                  - { id: aurora-a1, service: aurora,      label: "Aurora PostgreSQL A1" }

            - id: a-az2
              label: "VPC-A Availability Zone 2"

              public_subnet:
                id: a-pub2
                label: "VPC-A Public Subnet 2"
                resources: []

              app_subnet:
                id: a-app2
                label: "VPC-A Private App Subnet 2"
                resources: []

              db_subnet:
                id: a-db2
                label: "VPC-A Private DB Subnet 2"
                resources:
                  - { id: valkey-a2, service: elasticache, label: "Valkey / Redis A2" }
                  - { id: aurora-a2, service: aurora,      label: "Aurora PostgreSQL A2" }

            - id: a-az3
              label: "VPC-A Availability Zone 3"

              public_subnet:
                id: a-pub3
                label: "VPC-A Public Subnet 3"
                resources: []

              app_subnet:
                id: a-app3
                label: "VPC-A Private App Subnet 3"
                resources: []

              db_subnet:
                id: a-db3
                label: "VPC-A Private DB Subnet 3"
                resources:
                  - { id: valkey-a3, service: elasticache, label: "Valkey / Redis A3" }
                  - { id: aurora-a3, service: aurora,      label: "Aurora PostgreSQL A3" }

          compute_groups:
            - { id: eksa, kind: eks_cluster, node_service: ec2,     label: "EKS-A (EC2)" }
            - { id: ecsa, kind: ecs_cluster, node_service: fargate, label: "ECS-A (Fargate)" }

        - id: vpc-b
          label: "VPC-B (10.1.0.0/16)"

          azs:

            - id: b-az1
              label: "VPC-B Availability Zone 1"

              public_subnet:
                id: b-pub1
                label: "VPC-B Public Subnet 1"
                resources:
                  - { id: nat-b1,     service: nat_gateway, label: "NAT Gateway B" }
                  - { id: bastion-b1, service: ec2,         label: "Bastion Host B" }

              app_subnet:
                id: b-app1
                label: "VPC-B Private App Subnet 1"
                resources: []

              db_subnet:
                id: b-db1
                label: "VPC-B Private DB Subnet 1"
                resources:
                  - { id: valkey-b1, service: elasticache, label: "Valkey / Redis B1" }
                  - { id: aurora-b1, service: aurora,      label: "Aurora PostgreSQL B1" }

            - id: b-az2
              label: "VPC-B Availability Zone 2"

              public_subnet:
                id: b-pub2
                label: "VPC-B Public Subnet 2"
                resources: []

              app_subnet:
                id: b-app2
                label: "VPC-B Private App Subnet 2"
                resources: []

              db_subnet:
                id: b-db2
                label: "VPC-B Private DB Subnet 2"
                resources:
                  - { id: valkey-b2, service: elasticache, label: "Valkey / Redis B2" }
                  - { id: aurora-b2, service: aurora,      label: "Aurora PostgreSQL B2" }

            - id: b-az3
              label: "VPC-B Availability Zone 3"

              public_subnet:
                id: b-pub3
                label: "VPC-B Public Subnet 3"
                resources: []

              app_subnet:
                id: b-app3
                label: "VPC-B Private App Subnet 3"
                resources: []

              db_subnet:
                id: b-db3
                label: "VPC-B Private DB Subnet 3"
                resources:
                  - { id: valkey-b3, service: elasticache, label: "Valkey / Redis B3" }
                  - { id: aurora-b3, service: aurora,      label: "Aurora PostgreSQL B3" }

          compute_groups:
            - { id: eksb, kind: eks_cluster, node_service: ec2,     label: "EKS-B (EC2)" }
            - { id: ecsb, kind: ecs_cluster, node_service: fargate, label: "ECS-B (Fargate)" }

        - id: vpc-c
          label: "VPC-C (10.2.0.0/16)"

          azs:

            - id: c-az1
              label: "VPC-C Availability Zone 1"

              public_subnet:
                id: c-pub1
                label: "VPC-C Public Subnet 1"
                resources:
                  - { id: nat-c1,     service: nat_gateway, label: "NAT Gateway C" }
                  - { id: bastion-c1, service: ec2,         label: "Bastion Host C" }

              app_subnet:
                id: c-app1
                label: "VPC-C Private App Subnet 1"
                resources: []

              db_subnet:
                id: c-db1
                label: "VPC-C Private DB Subnet 1"
                resources:
                  - { id: valkey-c1, service: elasticache, label: "Valkey / Redis B1" }
                  - { id: aurora-c1, service: aurora,      label: "Aurora PostgreSQL B1" }

            - id: c-az2
              label: "VPC-C Availability Zone 2"

              public_subnet:
                id: c-pub2
                label: "VPC-C Public Subnet 2"
                resources: []

              app_subnet:
                id: c-app2
                label: "VPC-C Private App Subnet 2"
                resources: []

              db_subnet:
                id: c-db2
                label: "VPC-C Private DB Subnet 2"
                resources:
                  - { id: valkey-c2, service: elasticache, label: "Valkey / Redis B2" }
                  - { id: aurora-c2, service: aurora,      label: "Aurora PostgreSQL B2" }

            - id: c-az3
              label: "VPC-C Availability Zone 3"

              public_subnet:
                id: c-pub3
                label: "VPC-C Public Subnet 3"
                resources: []

              app_subnet:
                id: c-app3
                label: "VPC-C Private App Subnet 3"
                resources: []

              db_subnet:
                id: c-db3
                label: "VPC-C Private DB Subnet 3"
                resources:
                  - { id: valkey-c3, service: elasticache, label: "Valkey / Redis B3" }
                  - { id: aurora-c3, service: aurora,      label: "Aurora PostgreSQL B3" }

          compute_groups:
            - { id: eksc, kind: eks_cluster, node_service: ec2,     label: "EKS-C (EC2)" }
            - { id: ecsc, kind: ecs_cluster, node_service: fargate, label: "ECS-C (Fargate)" }

    edges:

      # Internet traffic per VPC
      - { source: users, target: waf-a, label: "HTTPS" }
      - { source: users, target: waf-b, label: "HTTPS" }
      - { source: waf-a, target: igw-a, label: "HTTPS" }
      - { source: igw-a, target: alb-a, label: "HTTPS" }
      - { source: waf-b, target: igw-b, label: "HTTPS" }
      - { source: users, target: waf-c, label: "HTTPS" }
      - { source: waf-c, target: igw-c, label: "HTTPS" }
      - { source: igw-c, target: alb-c, label: "HTTPS" }
      - { source: igw-b, target: alb-b, label: "HTTPS" }

      # ALB to compute lanes per VPC
      - { source: alb-a, target: eksa, label: "route" }
      - { source: alb-a, target: ecsa, label: "route" }
      - { source: alb-b, target: eksb, label: "route" }
      - { source: alb-b, target: ecsb, label: "route" }
      - { source: alb-c, target: eksc, label: "route" }
      - { source: alb-c, target: ecsc, label: "route" }

      # Bastion admin access
      - { source: bastion-a1, target: eksa-a-az1, label: "SSH" }
      - { source: bastion-b1, target: eksb-b-az1, label: "SSH" }
      - { source: bastion-c1, target: eksc-c-az1, label: "SSH" }

      # Compute lanes to RDS (one line per group box, top entry)
      - { source: eksa, target: aurora-a1, label: "SQL" }
      - { source: ecsa, target: aurora-a3, label: "SQL" }
      - { source: eksb, target: aurora-b1, label: "SQL" }
      - { source: ecsb, target: aurora-b3, label: "SQL" }
      - { source: eksc, target: aurora-c1, label: "SQL" }
      - { source: ecsc, target: aurora-c3, label: "SQL" }

      # Cache in front of DB (middle rows)
      - { source: valkey-a2, target: aurora-a2, label: "cache" }
      - { source: valkey-b2, target: aurora-b2, label: "cache" }
      - { source: valkey-c2, target: aurora-c2, label: "cache" }

      # Cross-VPC path via Transit Gateway
      - { source: eksa, target: tgw, label: "peered" }
      - { source: tgw,  target: eksb, label: "peered" }
      - { source: eksc, target: tgw, label: "peered",
          source_point: "1.0,0.33", target_point: "1.0,0.5",
          waypoints: [[2347, 4605], [3452, 4605], [3452, 2330], [2204, 2330]] }

      # ECR deploys to clusters
      - { source: ecr, target: eksa, label: "pull image" }
      - { source: ecr, target: eksb, label: "pull image" }
      - { source: ecr, target: eksc, label: "pull image" }


  - name: "Flow Diagram"
    type: flow

    nodes:
      - { id: f_users,   service: user,                      label: "Users", x: 60, y: 340 }
      - { id: f_waf_a,   service: waf,                       label: "AWS WAF A", x: 380, y: 160 }
      - { id: f_alb_a,   service: application_load_balancer, label: "ALB A", x: 700, y: 160 }
      - { id: f_eks_a,   service: eks,                       label: "EKS-A (EC2)", x: 1020, y: 120 }
      - { id: f_ecs_a,   service: fargate,                   label: "ECS-A Fargate", x: 1020, y: 300 }
      - { id: f_valkey_a, service: elasticache,              label: "Valkey A", x: 1500, y: 300 }
      - { id: f_aurora_a, service: aurora,                   label: "Aurora A", x: 1660, y: 160 }
      - { id: f_waf_b,   service: waf,                       label: "AWS WAF B", x: 380, y: 520 }
      - { id: f_alb_b,   service: application_load_balancer, label: "ALB B", x: 700, y: 520 }
      - { id: f_eks_b,   service: eks,                       label: "EKS-B (EC2)", x: 1020, y: 480 }
      - { id: f_ecs_b,   service: fargate,                   label: "ECS-B Fargate", x: 1020, y: 660 }
      - { id: f_valkey_b, service: elasticache,              label: "Valkey B", x: 1500, y: 620 }
      - { id: f_aurora_b, service: aurora,                   label: "Aurora B", x: 1660, y: 560 }
      - { id: f_waf_c,   service: waf,                       label: "AWS WAF C", x: 380, y: 880 }
      - { id: f_alb_c,   service: application_load_balancer, label: "ALB C", x: 700, y: 880 }
      - { id: f_eks_c,   service: eks,                       label: "EKS-C (EC2)", x: 1020, y: 840 }
      - { id: f_ecs_c,   service: fargate,                   label: "ECS-C Fargate", x: 1020, y: 1020 }
      - { id: f_valkey_c, service: elasticache,              label: "Valkey C", x: 1500, y: 1020 }
      - { id: f_aurora_c, service: aurora,                    label: "Aurora C", x: 1660, y: 880 }
      - { id: f_tgw,     service: transit_gateway,           label: "Transit Gateway", x: 1340, y: 340 }
      - { id: f_secrets, service: secrets_manager,           label: "Secrets Manager", x: 1660, y: 340 }
      - { id: f_kms,     service: key_management_service,    label: "KMS", x: 1980, y: 340 }

    edges:
      # Ingress per VPC
      - { source: f_users, target: f_waf_a, label: "HTTPS" }
      - { source: f_users, target: f_waf_b, label: "HTTPS" }
      - { source: f_users, target: f_waf_c, label: "HTTPS" }
      - { source: f_waf_a, target: f_alb_a, label: "HTTPS" }
      - { source: f_waf_b, target: f_alb_b, label: "HTTPS" }
      - { source: f_waf_c, target: f_alb_c, label: "HTTPS" }
      # ALB to compute
      - { source: f_alb_a, target: f_eks_a, label: "route" }
      - { source: f_alb_a, target: f_ecs_a, label: "route" }
      - { source: f_alb_b, target: f_eks_b, label: "route" }
      - { source: f_alb_b, target: f_ecs_b, label: "route" }
      - { source: f_alb_c, target: f_eks_c, label: "route" }
      - { source: f_alb_c, target: f_ecs_c, label: "route" }
      # Cross-VPC via Transit Gateway
      - { source: f_eks_a, target: f_tgw,   label: "peered" }
      - { source: f_tgw,   target: f_eks_b, label: "peered" }
      - { source: f_eks_c, target: f_tgw,   label: "peered" }
      # Data access per VPC
      - { source: f_eks_a, target: f_valkey_a, label: "cache" }
      - { source: f_eks_a, target: f_aurora_a, label: "SQL" }
      - { source: f_ecs_a, target: f_valkey_a, label: "cache" }
      - { source: f_eks_b, target: f_valkey_b, label: "cache" }
      - { source: f_eks_b, target: f_aurora_b, label: "SQL" }
      - { source: f_ecs_b, target: f_valkey_b, label: "cache" }
      - { source: f_eks_c, target: f_valkey_c, label: "cache" }
      - { source: f_eks_c, target: f_aurora_c, label: "SQL" }
      - { source: f_ecs_c, target: f_valkey_c, label: "cache" }
      # Secrets path
      - { source: f_eks_a, target: f_secrets, label: "fetch secrets",
          source_point: "0.5,0.0", target_point: "0.0,0.5",
          waypoints: [[1080, 60], [1640, 60], [1640, 400]] }
      - { source: f_secrets, target: f_kms,   label: "decrypt" }
