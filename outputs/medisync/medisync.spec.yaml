provider: aws
metadata:
  project: "MediSync Telehealth Platform"
  version: "1.0"
  date: "2026-09-29"
  creator: "Kiro"
  reviewer: "Cloud Team"

pages:
  # ------------------------------------------------------------------ Tab 1
  - name: "Architecture Diagram"
    type: architecture

    global:
      - { id: r53, service: route_53, label: "Route 53" }
      - { id: cf, service: cloudfront, label: "CloudFront" }
      - { id: s3, service: s3, label: "Static Assets (S3)" }
      - { id: iam, service: identity_and_access_management, label: "IAM" }

    edge:
      - { id: users, service: users, label: "Patients & Doctors" }   # outside cloud
      - { id: waf, service: waf, label: "WAF" }                       # inside cloud
      - { id: alb, service: application_load_balancer, label: "ALB" }
      - { id: igw, service: internet_gateway, label: "IGW" }          # left VPC border

    region:
      label: "ap-south-1"
      services:
        - { id: acm, service: certificate_manager_3, label: "ACM" }
        - { id: secrets, service: secrets_manager, label: "Secrets Manager" }
        - { id: kms, service: key_management_service, label: "KMS" }
        - { id: guardduty, service: guardduty, label: "GuardDuty" }
        - { id: cloudtrail, service: cloudtrail, label: "CloudTrail" }
        - { id: cw, service: cloudwatch_2, label: "CloudWatch" }
        - { id: pipeline, service: codepipeline, label: "CodePipeline" }
        - { id: build, service: codebuild, label: "CodeBuild" }
        - { id: ecr, service: ecr, label: "ECR" }

      vpc:
        label: "MediSync VPC"
        azs:
          - id: az1
            label: "Availability Zone 1"
            public_subnet:
              id: pub1
              label: "public-subnet-1"
              resources:
                - { id: nat1, service: nat_gateway, label: "NAT Gateway" }
            app_subnet: { id: app1, label: "app-subnet-1", resources: [] }
            db_subnet:
              id: data1
              label: "db-subnet-1"
              resources:
                - { id: cache1, service: elasticache, label: "ElastiCache" }
                - { id: aurora1, service: aurora, label: "Aurora Primary" }
          - id: az2
            label: "Availability Zone 2"
            public_subnet: { id: pub2, label: "public-subnet-2", resources: [] }
            app_subnet: { id: app2, label: "app-subnet-2", resources: [] }
            db_subnet:
              id: data2
              label: "db-subnet-2"
              resources:
                - { id: cache2, service: elasticache, label: "ElastiCache" }
                - { id: aurora2, service: aurora, label: "Aurora Replica" }
          - id: az3
            label: "Availability Zone 3"
            public_subnet: { id: pub3, label: "public-subnet-3", resources: [] }
            app_subnet: { id: app3, label: "app-subnet-3", resources: [] }
            db_subnet:
              id: data3
              label: "db-subnet-3"
              resources:
                - { id: cache3, service: elasticache, label: "ElastiCache" }
                - { id: aurora3, service: aurora, label: "Aurora Replica" }
        compute_groups:
          - { id: ecs, kind: ecs_cluster, node_service: fargate, label: "ECS Fargate Cluster" }

    edges:
      # Ingress path
      - { source: users, target: waf, label: "HTTPS" }
      - { source: waf, target: alb }
      # ALB to ECS cluster boundary (single edge, not per-AZ task)
      - { source: alb, target: ecs, label: "route" }
      # ECS tasks (AZ1) to data tier
      - { source: ecs-az1, target: cache1, label: "cache" }
      - { source: ecs-az1, target: aurora1, label: "SQL" }
      # Aurora replication primary -> replicas
      - { source: aurora1, target: aurora2, label: "replication", dashed: true }
      - { source: aurora1, target: aurora3, label: "replication", dashed: true }
      # CI/CD deploy to ECS cluster boundary
      - { source: ecr, target: ecs, label: "deploy", dashed: true }

  # ------------------------------------------------------------------ Tab 2
  - name: "Flow Diagram"
    type: flow
    nodes:
      - { id: f_user, service: users, label: "Patients & Doctors" }
      - { id: f_cf, service: cloudfront, label: "CloudFront" }
      - { id: f_waf, service: waf, label: "WAF" }
      - { id: f_alb, service: application_load_balancer, label: "ALB" }
      - { id: f_ecs, service: ecs, label: "ECS Fargate" }
      - { id: f_aurora, service: aurora, label: "Aurora PostgreSQL" }
      - { id: f_cache, service: elasticache, label: "ElastiCache" }
      - { id: f_pipe, service: codepipeline, label: "CodePipeline" }
      - { id: f_build, service: codebuild, label: "CodeBuild" }
      - { id: f_ecr, service: ecr, label: "ECR" }
      - { id: f_cw, service: cloudwatch_2, label: "CloudWatch" }
    edges:
      - { source: f_user, target: f_cf, label: "request" }
      - { source: f_cf, target: f_waf }
      - { source: f_waf, target: f_alb, label: "forward" }
      - { source: f_alb, target: f_ecs, label: "route" }
      - { source: f_ecs, target: f_aurora, label: "query" }
      - { source: f_ecs, target: f_cache, label: "session" }
      - { source: f_pipe, target: f_build, label: "build" }
      - { source: f_build, target: f_ecr, label: "push image" }
      - { source: f_ecr, target: f_ecs, label: "deploy", dashed: true }
      - { source: f_ecs, target: f_cw, label: "metrics", dashed: true }
