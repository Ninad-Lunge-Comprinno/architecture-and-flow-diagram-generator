provider: aws
metadata:
  client_name: "ShopNow"
  project: "ShopNow E-Commerce Platform"
  version: "1.0"
  date: "2026-10-05"
  creator: "To be filled"
  reviewer: "To be filled"

pages:
  - name: "Architecture Diagram"
    type: architecture

    global:
      - { id: cloudfront, service: cloudfront, label: "CloudFront" }

    edge:
      - { id: customers, service: users, label: "Customers" }
      - { id: waf, service: waf, label: "AWS WAF" }
      - { id: alb, service: application_load_balancer, label: "ALB" }
      - { id: igw, service: internet_gateway, label: "Internet Gateway" }

    region:
      label: "ap-south-1"
      services:
        - { id: ecr, service: ecr, label: "ECR" }
      vpc:
        label: "ShopNow VPC"
        azs:
          - id: az1
            label: "Availability Zone 1"
            public_subnet:
              id: pub1
              label: "public-subnet-1"
              resources:
                - { id: nat1, service: nat_gateway, label: "NAT Gateway" }
            app_subnet:
              id: app1
              label: "app-subnet-1"
              resources: []
            db_subnet:
              id: data1
              label: "db-subnet-1"
              resources:
                - { id: aurora1, service: aurora, label: "Aurora Primary" }
                - { id: cache1, service: elasticache, label: "ElastiCache Redis" }
          - id: az2
            label: "Availability Zone 2"
            public_subnet:
              id: pub2
              label: "public-subnet-2"
              resources: []
            app_subnet:
              id: app2
              label: "app-subnet-2"
              resources: []
            db_subnet:
              id: data2
              label: "db-subnet-2"
              resources:
                - { id: aurora2, service: aurora, label: "Aurora Standby" }
                - { id: cache2, service: elasticache, label: "ElastiCache Redis" }
          - id: az3
            label: "Availability Zone 3"
            public_subnet:
              id: pub3
              label: "public-subnet-3"
              resources: []
            app_subnet:
              id: app3
              label: "app-subnet-3"
              resources: []
            db_subnet:
              id: data3
              label: "db-subnet-3"
              resources:
                - { id: cache3, service: elasticache, label: "ElastiCache Redis" }
        compute_groups:
          - { id: ecs, kind: ecs_cluster, node_service: fargate, label: "ECS Fargate Cluster" }

    edges:
      - { source: customers, target: waf, label: "HTTPS" }
      - { source: waf, target: igw }
      - { source: igw, target: alb }
      - { source: cloudfront, target: alb, label: "origin" }
      - { source: alb, target: ecs, label: "route" }
      - { source: ecs, target: cache1, label: "cache" }
      - { source: ecs, target: aurora1, label: "queries" }
      - { source: ecr, target: ecs, label: "deploy", dashed: true }

  - name: "Request Flow"
    type: flow
    nodes:
      - { id: customer, service: users, label: "Customer", scope: external }
      - { id: waf, service: waf, label: "AWS WAF" }
      - { id: cloudfront, service: cloudfront, label: "CloudFront" }
      - { id: alb, service: application_load_balancer, label: "ALB" }
      - { id: fargate, service: fargate, label: "ECS Fargate", scope: vpc }
      - { id: cache, service: elasticache, label: "ElastiCache Redis", scope: vpc }
      - { id: aurora, service: aurora, label: "Aurora PostgreSQL", scope: vpc }
    edges:
      - { source: customer, target: waf, label: "HTTPS request" }
      - { source: waf, target: cloudfront, label: "filtered" }
      - { source: cloudfront, target: alb, label: "dynamic origin" }
      - { source: alb, target: fargate, label: "route" }
      - { source: fargate, target: cache, label: "check cache" }
      - { source: cache, target: customer, label: "cache hit: response", dashed: true }
      - { source: fargate, target: aurora, label: "cache miss: query" }
    groups:
      - id: shopnow_vpc
        kind: vpc
        label: "ShopNow VPC"
        members: [fargate, cache, aurora]
