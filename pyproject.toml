[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-diagram-generator"
version = "0.1.0"
description = "Kiro skill helper: generate draw.io architecture and flow diagrams from a structured spec."
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
png = ["Pillow>=10.0"]

# Installing the project exposes the generator as a `arch-diagram` command.
# Entry point target is the flat module below.
[project.scripts]
arch-diagram = "generate_diagram:main"

# The source modules are flat (generate_diagram, layout, routing, shapes) and
# import each other by bare name, so the package root is the scripts directory.
[tool.setuptools]
py-modules = ["generate_diagram", "diagram", "spec", "arch_page", "flow_page", "layout", "routing", "shapes", "render_png"]

[tool.setuptools.package-dir]
"" = ".kiro/scripts/arch-diagram"

[tool.pytest.ini_options]
pythonpath = [".kiro/scripts/arch-diagram"]
testpaths = [".kiro/scripts/arch-diagram/tests"]
