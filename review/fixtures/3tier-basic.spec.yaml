# Minimal 3-tier fixture based on Sadhaka AI reference diagram
# This tests the standard house-style: 3 AZs, 1 NAT, ECS cluster

provider: aws
metadata:
  project: "Fixture: 3-Tier Basic"
  version: "1.0"
  date: "2026-09-28"
  creator: "Regression Test"
  reviewer: "Auto"

pages:
  - name: "Architecture Diagram"
    type: architecture

    global:
      - { id: r53, service: route_53, label: "Route 53" }
      - { id: cf, service: cloudfront, label: "CloudFront" }
      - { id: s3, service: s3, label: "S3" }
      - { id: iam, service: identity_and_access_management, label: "IAM" }

    edge:
      - { id: users, service: user, label: "Users" }
      - { id: waf, service: waf, label: "WAF" }
      - { id: alb, service: application_load_balancer, label: "ALB" }
      - { id: igw, service: internet_gateway, label: "IGW" }

    region:
      label: "ap-south-1"
      services:
        - { id: kms, service: key_management_service, label: "KMS" }
        - { id: secrets, service: secrets_manager, label: "Secrets" }
        - { id: cw, service: cloudwatch_2, label: "CloudWatch" }
        - { id: ecr, service: ecr, label: "ECR" }

      vpc:
        label: "App VPC"
        azs:
          - id: az1
            label: "Availability Zone 1"
            public_subnet:
              id: pub1
              label: "public-subnet-1"
              resources:
                - { id: nat1, service: nat_gateway, label: "NAT" }
            app_subnet:
              id: app1
              label: "app-subnet-1"
              resources: []
            db_subnet:
              id: data1
              label: "db-subnet-1"
              resources:
                - { id: cache1, service: elasticache, label: "Redis" }
                - { id: rds1, service: rds, label: "RDS Primary" }
          - id: az2
            label: "Availability Zone 2"
            public_subnet:
              id: pub2
              label: "public-subnet-2"
              resources: []
            app_subnet:
              id: app2
              label: "app-subnet-2"
              resources: []
            db_subnet:
              id: data2
              label: "db-subnet-2"
              resources:
                - { id: cache2, service: elasticache, label: "Redis" }
                - { id: rds2, service: rds, label: "RDS Replica" }
          - id: az3
            label: "Availability Zone 3"
            public_subnet:
              id: pub3
              label: "public-subnet-3"
              resources: []
            app_subnet:
              id: app3
              label: "app-subnet-3"
              resources: []
            db_subnet:
              id: data3
              label: "db-subnet-3"
              resources:
                - { id: cache3, service: elasticache, label: "Redis" }
                - { id: rds3, service: rds, label: "RDS Replica" }

        compute_groups:
          - { id: ecs, kind: ecs_cluster, node_service: fargate, label: "ECS Cluster" }

    edges:
      - { source: users, target: waf, label: "HTTPS" }
      - { source: waf, target: alb }
      - { source: alb, target: ecs, label: "route" }
      - { source: ecs-az1, target: cache1, label: "cache" }
      - { source: ecs-az1, target: rds1, label: "SQL" }
      - { source: rds1, target: rds2, label: "replication", dashed: true }
      - { source: rds1, target: rds3, label: "replication", dashed: true }
      - { source: ecr, target: ecs, label: "deploy", dashed: true }
