# Flow diagram fixture with branch and merge pattern
# Tests flow page layout and edge routing

provider: aws
metadata:
  project: "Fixture: Flow with Branch/Merge"
  version: "1.0"
  date: "2026-09-28"
  creator: "Regression Test"
  reviewer: "Auto"

pages:
  - name: "Flow Diagram"
    type: flow
    nodes:
      - { id: f_user, service: user, label: "User" }
      - { id: f_waf, service: waf, label: "WAF" }
      - { id: f_alb, service: application_load_balancer, label: "ALB" }
      # Branch: ECS and Lambda handle different request types
      - { id: f_ecs, service: ecs, label: "ECS (API)" }
      - { id: f_lambda, service: lambda, label: "Lambda (Events)" }
      # Merge: Both write to same data stores
      - { id: f_cache, service: elasticache, label: "Redis Cache" }
      - { id: f_db, service: aurora, label: "Aurora DB" }
      - { id: f_s3, service: s3, label: "S3 Storage" }

    edges:
      # Linear ingress
      - { source: f_user, target: f_waf, label: "request" }
      - { source: f_waf, target: f_alb, label: "filter" }
      # Branch
      - { source: f_alb, target: f_ecs, label: "sync API" }
      - { source: f_alb, target: f_lambda, label: "async events" }
      # ECS path
      - { source: f_ecs, target: f_cache, label: "session" }
      - { source: f_ecs, target: f_db, label: "query" }
      # Lambda path (merges to same destinations)
      - { source: f_lambda, target: f_db, label: "write" }
      - { source: f_lambda, target: f_s3, label: "store" }
      # Cross-branch (ECS also uses S3)
      - { source: f_ecs, target: f_s3, label: "files" }
