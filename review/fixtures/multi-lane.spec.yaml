# Multi-lane fixture based on MediaMint pattern
# Tests multiple compute-group lanes (ASG + ECS)

provider: aws
metadata:
  project: "Fixture: Multi-Lane Compute"
  version: "1.0"
  date: "2026-09-28"
  creator: "Regression Test"
  reviewer: "Auto"

pages:
  - name: "Architecture Diagram"
    type: architecture

    global:
      - { id: r53, service: route_53, label: "Route 53" }
      - { id: cf, service: cloudfront, label: "CloudFront" }

    edge:
      - { id: users, service: user, label: "Users" }
      - { id: waf, service: waf, label: "WAF" }
      - { id: alb, service: application_load_balancer, label: "ALB" }
      - { id: igw, service: internet_gateway, label: "IGW" }

    region:
      label: "us-east-1"
      services:
        - { id: ecr, service: ecr, label: "ECR" }
        - { id: cw, service: cloudwatch_2, label: "CloudWatch" }

      vpc:
        label: "Multi-Lane VPC"
        azs:
          - id: az1
            label: "Availability Zone 1"
            public_subnet:
              id: pub1
              label: "public-subnet-1"
              resources:
                - { id: nat1, service: nat_gateway, label: "NAT" }
            app_subnet:
              id: app1
              label: "app-subnet-1"
              resources: []
            db_subnet:
              id: data1
              label: "db-subnet-1"
              resources:
                - { id: rds1, service: rds, label: "RDS" }
          - id: az2
            label: "Availability Zone 2"
            public_subnet:
              id: pub2
              label: "public-subnet-2"
              resources: []
            app_subnet:
              id: app2
              label: "app-subnet-2"
              resources: []
            db_subnet:
              id: data2
              label: "db-subnet-2"
              resources:
                - { id: rds2, service: rds, label: "RDS" }
          - id: az3
            label: "Availability Zone 3"
            public_subnet:
              id: pub3
              label: "public-subnet-3"
              resources: []
            app_subnet:
              id: app3
              label: "app-subnet-3"
              resources: []
            db_subnet:
              id: data3
              label: "db-subnet-3"
              resources:
                - { id: rds3, service: rds, label: "RDS" }

        compute_groups:
          - { id: asg, kind: asg, node_service: ec2, label: "Auto Scaling Group" }
          - { id: ecs, kind: ecs_cluster, node_service: fargate, label: "ECS Cluster" }

    edges:
      - { source: users, target: waf }
      - { source: waf, target: alb }
      - { source: alb, target: asg, label: "web traffic" }
      - { source: alb, target: ecs, label: "API traffic" }
      - { source: asg-az1, target: rds1, label: "SQL" }
      - { source: ecs-az1, target: rds1, label: "SQL" }
      - { source: ecr, target: ecs, label: "deploy", dashed: true }
